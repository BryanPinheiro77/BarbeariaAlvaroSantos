name: Restart WAHA Weekly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  restart-waha:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get latest active deployment id
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          QUERY='query($projectId: String!, $environmentId: String!, $serviceId: String!) {
            deployments(input: {
              projectId: $projectId,
              environmentId: $environmentId,
              serviceId: $serviceId
            }) {
              edges {
                node {
                  id
                  status
                  createdAt
                }
              }
            }
          }'

          PAYLOAD=$(jq -n \
            --arg query "$QUERY" \
            --arg projectId "$PROJECT_ID" \
            --arg environmentId "$ENVIRONMENT_ID" \
            --arg serviceId "$SERVICE_ID" \
            '{
              query: $query,
              variables: {
                projectId: $projectId,
                environmentId: $environmentId,
                serviceId: $serviceId
              }
            }')

          RESPONSE=$(curl -s https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESPONSE"

          DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '
            .data.deployments.edges
            | map(.node)
            | map(select(.status == "SUCCESS"))
            | sort_by(.createdAt)
            | reverse
            | .[0].id
          ')

          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
            echo "Nenhum deployment SUCCESS encontrado."
            exit 1
          fi

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Restart deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          QUERY='mutation($deploymentId: String!) {
            deploymentRestart(id: $deploymentId)
          }'

          PAYLOAD=$(jq -n \
            --arg query "$QUERY" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            '{
              query: $query,
              variables: {
                deploymentId: $deploymentId
              }
            }')

          RESPONSE=$(curl -s https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESPONSE"
